<!DOCTYPE html>
<html lang="en">
<!-- ==========================================================================
  BCFG PROTOTYPE — mobile view
  The live site (served from /) in a centred phone frame at its true 390x844,
  so it renders exactly the mobile layout a visitor's phone would get. If the
  window is too short or narrow for the frame, it scales down to fit.

  Reached from the "Mobile" button on /prototype/. Real site lives at /.
========================================================================== -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Collar Fishing Guide - Mobile Preview</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/bcfg/logo-card-navy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b1930;color:#f8f7f3;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#a9bedf}
:focus-visible{outline:2px solid #e05c22;outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 18px;border-radius:999px;text-decoration:none;cursor:pointer;font:600 12.5px/1 'Oswald',sans-serif;letter-spacing:1.3px;text-transform:uppercase;white-space:nowrap}
.btn-primary{border:none;background:#e05c22;color:#0b1930}
.btn-secondary{border:1px solid rgba(169,190,223,.35);background:none;color:#a9bedf}
</style>
</head>
<body>

<div style="min-height:100%;display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,#16305c 0%,#0b1930 60%)">

  <div style="flex:0 0 auto;background:rgba(11,25,48,.86);backdrop-filter:blur(12px);border-bottom:1px solid rgba(169,190,223,.16)">
    <div style="max-width:1320px;margin:0 auto;padding:14px clamp(16px,3vw,32px);display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="display:grid;gap:2px;margin-right:auto">
        <span style="font:700 10.5px/1 'Inter',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#e05c22">Mobile Preview</span>
        <span style="font-family:'Anton',Impact,sans-serif;font-size:20px;letter-spacing:.6px;text-transform:uppercase;color:#f8f7f3">Blue Collar Fishing Guide</span>
      </div>
      <a href="/prototype/" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back
      </a>
      <a href="/" target="_blank" rel="noopener" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>Full Site
      </a>
    </div>
  </div>

  <!-- min-height:0 lets this flex child shrink below its content height, so a
       sub-pixel header height can't push the frame into a stray scrollbar. -->
  <div id="stage" style="flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px clamp(16px,3vw,32px)">
    <div id="box">
      <div id="shell" style="transform-origin:0 0;width:414px;padding:12px;border-radius:50px;background:#0e1a30;border:1px solid rgba(169,190,223,.22);box-shadow:0 40px 80px -40px rgba(0,0,0,.85)">
        <div style="position:relative;width:390px;height:844px;border-radius:38px;overflow:hidden;background:#f8f7f3">
          <iframe src="/" title="Mobile preview of the Blue Collar Fishing Guide site" style="width:390px;height:844px;border:none;display:block;background:#f8f7f3"></iframe>
          <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:28px;border-radius:999px;background:#0e1a30;pointer-events:none"></div>
          <div style="position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:999px;background:rgba(14,34,68,.4);pointer-events:none"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var box = document.getElementById('box');
  var shell = document.getElementById('shell');

  /* The phone frame is a fixed 414x868 mock. Show it at 1:1 whenever it fits,
     and shrink it to fit shorter or narrower windows rather than clipping it. */
  function fit() {
    box.style.width = '0px';
    box.style.height = '0px';
    box.style.overflow = 'visible';
    shell.style.transform = 'none';

    var w = shell.offsetWidth;
    var h = shell.offsetHeight;
    // Measure with getBoundingClientRect, not clientWidth/clientHeight: those
    // round to whole pixels (827.5 -> 828), which sizes the frame a pixel too
    // tall and puts a stray scrollbar on the page. Floor for the same reason.
    var cs = getComputedStyle(stage);
    var rect = stage.getBoundingClientRect();
    var availW = rect.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var availH = rect.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var scale = Math.min(1, availW / w, availH / h);

    shell.style.transform = 'scale(' + scale + ')';
    box.style.width = Math.floor(w * scale) + 'px';
    box.style.height = Math.floor(h * scale) + 'px';
  }

  fit();
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>

</body>
</html>
